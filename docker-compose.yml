version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: ftms_postgres
    environment:
      POSTGRES_DB: factory_traffic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d factory_traffic"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ftms_backend
    environment:
      DEBUG: "True"
      SECRET_KEY: "django-insecure-ftms-docker-deployment-secret-key-2026"
      DATABASE_URL: "postgresql://postgres:postgrespassword@db:5432/factory_traffic"
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ADMIN_API_TOKEN: "factory-admin-token-2026"
      AUTH_REQUIRED_FOR_COMMANDS: "False"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ftms_frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000/api"
      NEXT_PUBLIC_DEFAULT_ADMIN_TOKEN: "factory-admin-token-2026"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
